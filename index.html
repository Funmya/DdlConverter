<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDL to Excel Matrix Generator</title>
  <!-- ExcelJS / FileSaver CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --switch-red: #ff4554;
      --switch-blue: #00c3e3;
      --switch-yellow: #ffcc00;
      --switch-green: #2cd673;
      --switch-purple: #9b51e0;
      --bg-color: #eef2f7;
      --card-bg: #ffffff;
      --text-main: #2b303a;
      --border-radius-lg: 28px;
      --border-radius-md: 18px;
      --shadow-pop: 0 10px 0px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'M PLUS Rounded 1c', sans-serif; user-select: none; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 195, 227, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 69, 84, 0.15) 0%, transparent 20%);
      color: var(--text-main);
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border-radius: var(--border-radius-lg);
      padding: 35px;
      box-shadow: var(--shadow-pop);
      border: 4px solid #333644;
      position: relative;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      border-bottom: 4px dashed #e0e6ed;
      padding-bottom: 20px;
    }

    .title-group { display: flex; align-items: center; gap: 15px; }

    .badge-icon {
      background: var(--switch-red);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 4px 0 #cc2233;
      transform: rotate(-3deg);
    }

    h1 { font-size: 26px; font-weight: 900; color: var(--text-main); }
    .subtitle { font-size: 13px; color: #7a8294; font-weight: 800; }

    /* Dropzone */
    .drop-zone {
      border: 4px dashed var(--switch-blue);
      background: #f0fbff;
      border-radius: var(--border-radius-md);
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background: #e1f7ff;
      border-color: #009bb3;
      transform: scale(1.01);
    }

    .drop-icon { font-size: 42px; margin-bottom: 8px; display: inline-block; transition: transform 0.3s; }
    .drop-zone:hover .drop-icon { transform: translateY(-6px) scale(1.1); }
    .drop-text { font-size: 16px; font-weight: 800; color: #007088; }
    .drop-subtext { font-size: 12px; color: #6bb0c0; margin-top: 4px; font-weight: 800; }

    .section-title {
      font-size: 16px;
      font-weight: 900;
      margin: 25px 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: ''; display: inline-block; width: 12px; height: 22px;
      background: var(--switch-yellow); border-radius: 6px; border: 2px solid #333644;
    }

    textarea {
      width: 100%; height: 160px;
      border: 3px solid #333644; border-radius: var(--border-radius-md);
      padding: 15px; font-family: 'Courier New', 'M PLUS Rounded 1c', monospace;
      font-size: 14px; font-weight: 500; color: var(--text-main);
      background: #fafbfc; resize: vertical; outline: none; user-select: text;
    }

    textarea:focus { border-color: var(--switch-purple); background: #ffffff; }

    /* POP Button */
    .btn {
      display: inline-block; padding: 14px 28px; font-size: 16px; font-weight: 900;
      color: white; border-radius: 50px; border: 3px solid #333644; cursor: pointer;
      outline: none; transition: all 0.1s ease; margin-top: 15px;
    }

    .btn:active { transform: translateY(5px) !important; box-shadow: 0 1px 0px #333644 !important; }
    .btn-blue { background: var(--switch-blue); box-shadow: 0 6px 0px #008ba3; }
    .btn-green { background: var(--switch-green); box-shadow: 0 6px 0px #1fa858; }

    .table-container {
      margin-top: 25px; overflow-x: auto; border-radius: var(--border-radius-md);
      border: 3px solid #333644; background: white;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f1f4f9; padding: 14px 16px; font-weight: 900; font-size: 14px; border-bottom: 3px solid #333644; }
    td { padding: 12px 16px; border-bottom: 2px dashed #e1e6ed; font-size: 14px; font-weight: 800; user-select: text; }

    .custom-checkbox { width: 22px; height: 22px; accent-color: var(--switch-red); transform: scale(1.2); }
    .pk-badge {
      background: var(--switch-red); color: white; font-weight: 900;
      padding: 2px 10px; border-radius: 20px; font-size: 13px; border: 2px solid #333644;
    }

    #outputSection { display: none; }

    /* Jelly Animation */
    .jelly-anim { animation: jelly 0.6s ease; }
    @keyframes jelly {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.12, 0.88); }
      40% { transform: scale(0.9, 1.1); }
      50% { transform: scale(1.05, 0.95); }
      100% { transform: scale(1, 1); }
    }

    /* Toast */
    .toast {
      position: fixed; top: 25px; right: 25px; background: #333644; color: white;
      padding: 16px 24px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
      z-index: 9999; cursor: pointer; border: 3px solid white; transform: translateX(150%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { transform: translateX(0); }
    .toast-icon { background: var(--switch-green); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div class="title-group">
        <div class="badge-icon">🎮</div>
        <div>
          <h1>DDL カラム抽出 ＆ Excel変換</h1>
          <div class="subtitle">DDLからカラム一覧を横並びマトリクスExcelへ一発変換！</div>
        </div>
      </div>
    </div>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".sql,.txt,.ddl" style="display: none;">
      <div class="drop-icon">📁</div>
      <div class="drop-text">ここにDDLファイルをドロップ！</div>
      <div class="drop-subtext">またはクリックしてファイルを選択 (.sql, .ddl, .txt)</div>
    </div>

    <!-- Textarea -->
    <div class="section-title">DDLテキスト</div>
    <textarea id="ddlInput" placeholder="CREATE TABLE users (&#10;    user_id INT PRIMARY KEY, -- ユーザーID&#10;    user_name VARCHAR(100) NOT NULL, -- ユーザー名&#10;    email VARCHAR(255) -- メールアドレス&#10;);"></textarea>

    <button class="btn btn-blue" id="parseBtn">✨ カラム一覧出力</button>

    <!-- Output -->
    <div id="outputSection">
      <div class="section-title">解析結果 (カラム一覧)</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 70px; text-align: center;">選択</th>
              <th style="width: 70px; text-align: center;">PK</th>
              <th>カラム和名</th>
              <th>カラム物理名</th>
              <th>型(桁)</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <button class="btn btn-green" id="exportBtn">📊 Excel出力</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <div>
      <div id="toastText" style="font-size:14px; font-weight:800;">Excelファイルを保存しました！</div>
      <span style="font-size:11px; color:#abb2c4;">クリックで案内を表示（10秒で消えます）</span>
    </div>
  </div>

  <script>
    // Pop audio generator
    const playPop = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.08);
      } catch(e){}
    };

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const ddlInput = document.getElementById('ddlInput');
    const parseBtn = document.getElementById('parseBtn');
    const outputSection = document.getElementById('outputSection');
    const tableBody = document.getElementById('tableBody');
    const exportBtn = document.getElementById('exportBtn');
    const toast = document.getElementById('toast');

    let parsedColumns = [];
    let toastTimer = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault(); dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        ddlInput.value = e.target.result;
        dropZone.classList.remove('jelly-anim');
        void dropZone.offsetWidth;
        dropZone.classList.add('jelly-anim');
        playPop();
      };
      reader.readAsText(file);
    }

    parseBtn.addEventListener('click', () => { playPop(); parseDDL(); });

    function parseDDL() {
      const text = ddlInput.value;
      if (!text.trim()) return alert('DDLを入力してください。');

      parsedColumns = [];
      const cleanText = text.replace(/\/\*[\s\S]*?\*\//g, '');
      const lines = cleanText.split('\n');

      let tablePkColumns = [];
      const pkMatch = cleanText.match(/PRIMARY\s+KEY\s*\(([^)]+)\)/i);
      if (pkMatch) {
        tablePkColumns = pkMatch[1].split(',').map(s => s.trim().replace(/[`"'\[\]]/g, ''));
      }

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('--') || trimmed.toUpperCase().startsWith('CREATE TABLE') || trimmed.startsWith(')')) return;

        let comment = '';
        const commentIdx = trimmed.indexOf('--');
        if (commentIdx !== -1) {
          comment = trimmed.substring(commentIdx + 2).trim();
          trimmed = trimmed.substring(0, commentIdx).trim();
        }

        trimmed = trimmed.replace(/,\s*$/, '');
        const tokens = trimmed.split(/\s+/);
        if (tokens.length >= 2) {
          const rawColName = tokens[0].replace(/[`"'\[\]]/g, '');
          if (['PRIMARY', 'KEY', 'UNIQUE', 'CONSTRAINT'].includes(rawColName.toUpperCase())) return;

          const dataType = tokens[1];
          const isPk = trimmed.toUpperCase().includes('PRIMARY KEY') || tablePkColumns.includes(rawColName);
          let colJapaneseName = rawColName;

          const commentMatch = trimmed.match(/COMMENT\s+['"]([^'"]+)['"]/i);
          if (commentMatch) colJapaneseName = commentMatch[1];
          else if (comment) colJapaneseName = comment.replace(/^[:：\s]+/, '').trim();

          parsedColumns.push({ name: rawColName, type: dataType, japaneseName: colJapaneseName, isPk });
        }
      });

      let pkSeq = 1;
      parsedColumns.forEach(c => { if (c.isPk) c.pkSeq = pkSeq++; });

      renderTable();
      outputSection.style.display = 'block';
    }

    function renderTable() {
      tableBody.innerHTML = '';
      parsedColumns.forEach((col, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align:center;"><input type="checkbox" class="custom-checkbox" ${col.isPk ? 'disabled checked' : 'checked'}></td>
          <td style="text-align:center;">${col.isPk ? '<span class="pk-badge">＊</span>' : ''}</td>
          <td>${col.japaneseName}</td>
          <td>${col.name}</td>
          <td>${col.type}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    exportBtn.addEventListener('click', async () => {
      playPop();
      const rows = tableBody.querySelectorAll('tr');
      const selectedData = [];
      rows.forEach((row, idx) => {
        const chk = row.querySelector('input[type="checkbox"]');
        if (chk && chk.checked) selectedData.push(parsedColumns[idx]);
      });

      if (!selectedData.length) return alert('カラムを選択してください。');

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('Matrix');

      worksheet.addRow(selectedData.map(c => c.isPk ? `${c.japaneseName}※PK${c.pkSeq}` : c.japaneseName));
      worksheet.addRow(selectedData.map(c => c.name));
      worksheet.addRow(selectedData.map(c => c.type));

      worksheet.eachRow((row, rNum) => {
        row.eachCell(cell => {
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
          cell.border = { top: {style:'thin', color:{argb:'D0D0D0'}}, left: {style:'thin', color:{argb:'D0D0D0'}}, bottom: {style:'thin', color:{argb:'D0D0D0'}}, right: {style:'thin', color:{argb:'D0D0D0'}} };
          if (rNum === 1) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'EBF3FE' } };
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      saveAs(new Blob([buffer]), `DDL_Matrix_${new Date().toISOString().slice(0,10)}.xlsx`);

      if (toastTimer) clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 10000);
    });

    toast.addEventListener('click', () => {
      toast.classList.remove('show');
      alert('ブラウザの「ダウンロード」をご確認ください。');
    });
  </script>
</body>
</html>
